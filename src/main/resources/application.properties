spring.application.name=FastFoodSystem

# MS SQL Database Config
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=fastfooddborg;encrypt=true;trustServerCertificate=true
spring.datasource.driverClassName=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.username=sa
spring.datasource.password=123

# JPA Config
# (Spring Boot 3/Hibernate 6 auto-detects dialect, so explicit dialect is not strictly needed)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Handle large base64 payloads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
server.tomcat.max-http-form-post-size=10MB
