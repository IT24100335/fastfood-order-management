<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Sign Up | CraveBites</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/customer.css">
    <style>
        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            background: linear-gradient(135deg, rgba(13,13,13,0.95), rgba(0,0,0,0.85)), 
                        url('https://images.unsplash.com/photo-1513104890138-7c749659a591?auto=format&fit=crop&w=1950&q=80') center/cover no-repeat;
            overflow: hidden;
        }

        .auth-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
            animation: fadeIn 1s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .signup-card {
            background: rgba(20, 20, 20, 0.6);
            padding: 50px;
            border-radius: 30px;
            width: 100%;
            max-width: 440px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 40px 100px rgba(0, 0, 0, 0.8);
            text-align: center;
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            animation: slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .subtitle { color: rgba(255,255,255,0.5); margin-bottom: 35px; font-size: 1rem; font-weight: 400; }

        .form-group { text-align: left; margin-bottom: 25px; }
        .form-group label { display: block; margin-bottom: 10px; font-weight: 700; color: white; font-size: 0.9rem; letter-spacing: 0.5px; }
        .form-group input { 
            width: 100%; padding: 14px 18px; border: 1px solid rgba(255, 255, 255, 0.1); 
            border-radius: 12px; font-size: 1rem; box-sizing: border-box;
            background: rgba(0, 0, 0, 0.3); color: white; transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
            font-family: 'Outfit';
        }
        .form-group input:focus {
            outline: none;
            border-color: var(--primary-color);
            background: rgba(0, 0, 0, 0.5);
            box-shadow: 0 0 0 4px rgba(255, 90, 54, 0.15);
        }

        .primary-btn {
            width: 100%; padding: 16px; justify-content: center;
            margin-top: 15px; font-size: 1.15rem; font-weight: 800;
        }

        .footer-link { margin-top: 30px; font-size: 0.95rem; color: rgba(255,255,255,0.5); }
        .footer-link a { color: var(--primary-color); text-decoration: none; font-weight: 800; transition: all 0.3s ease; }
        .footer-link a:hover { color: white; text-shadow: 0 0 10px var(--primary-color); }
        .error-msg { 
            background: rgba(229, 57, 53, 0.1); border: 1px solid rgba(229, 57, 53, 0.3); 
            color: #ff5252; padding: 12px; border-radius: 10px; margin-bottom: 20px; 
            font-size: 0.9rem; font-weight: 600; display: none;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(50px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <!-- Navbar -->
    <header class="glass-nav">
        <a href="/index.html" style="text-decoration:none;"><div class="logo">Crave<span>Bites</span></div></a>
        <div class="nav-actions">
            <div id="user-display" class="user-info">
                <a href="/login.html" class="login-link">Login</a>
                <a href="/signup.html" class="login-link" style="color:var(--primary-color)">Sign Up</a>
            </div>
        </div>
    </header>

    <div class="auth-container">
    <div class="signup-card">
        <div class="logo">Crave<span>Bites</span></div>
        <p class="subtitle">Join the Crave community today!</p>
        <div id="error-msg" class="error-msg"></div>
        <form id="signup-form">
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="email" placeholder="Enter your email" required>
            </div>
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="username" placeholder="Choose a username" minlength="4" required>
                <small style="color:var(--text-muted); font-size:0.75rem;">At least 4 characters.</small>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="Create a password" minlength="6" required>
                <small style="color:var(--text-muted); font-size:0.75rem;">At least 6 characters.</small>
            </div>
            <div class="form-group">
                <label>Confirm Password</label>
                <input type="password" id="confirmPassword" placeholder="Confirm your password" required>
            </div>
            <button type="submit" class="primary-btn">Sign Up</button>
        </form>
        <p class="footer-link">Already have an account? <a href="/login.html">Log In</a></p>
    </div>
    </div>

    <script>
        document.getElementById('signup-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const errorMsg = document.getElementById('error-msg');

            if (username.length < 4) {
                errorMsg.innerText = 'Username must be at least 4 characters.';
                errorMsg.style.display = 'block';
                return;
            }
            if (password.length < 6) {
                errorMsg.innerText = 'Password must be at least 6 characters.';
                errorMsg.style.display = 'block';
                return;
            }
            if (password !== confirmPassword) {
                errorMsg.innerText = 'Passwords do not match.';
                errorMsg.style.display = 'block';
                return;
            }

            try {
                const response = await fetch('/api/users/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, username, password, role: 'CUSTOMER' })
                });

                if (response.ok) {
                    alert('Registration successful! Please log in.');
                    window.location.href = '/login.html';
                } else {
                    const text = await response.text();
                    errorMsg.innerText = text || 'Registration failed.';
                    errorMsg.style.display = 'block';
                }
            } catch (err) {
                errorMsg.innerText = 'Connection error.';
                errorMsg.style.display = 'block';
            }
        });
    </script>
</body>
</html>
