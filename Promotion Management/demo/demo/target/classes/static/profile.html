<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile | CraveBites</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/customer.css">
    <style>
        .profile-container { max-width: 1000px; margin: 120px auto; padding: 20px; }
        .profile-grid { display: grid; grid-template-columns: 350px 1fr; gap: 30px; }
        .glass-card { background: rgba(255,255,255,0.05); backdrop-filter: blur(15px); border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; padding: 30px; color: white; }
        .profile-sidebar { display: flex; flex-direction: column; align-items: center; text-align: center; }
        .avatar { width: 120px; height: 120px; background: var(--primary-color); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 3rem; margin-bottom: 20px; }
        .stat-item { padding: 15px; border-top: 1px solid rgba(255,255,255,0.1); width: 100%; display: flex; justify-content: space-between; margin-top: 10px; }
        .activity-item { background: rgba(0,0,0,0.2); padding: 20px; border-radius: 12px; margin-bottom: 15px; border-left: 4px solid var(--primary-color); position: relative; }
        .order-meta { font-size: 0.85rem; color: rgba(255,255,255,0.6); display: flex; justify-content: space-between; margin-top: 10px; }
        .rating-stars { color: #fbc02d; font-size: 0.9rem; }

        .edit-btn { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: white; padding: 5px 12px; border-radius: 8px; cursor: pointer; font-size: 0.8rem; transition: 0.3s; }
        .edit-btn:hover { background: var(--primary-color); }
        .cancel-btn { background: rgba(255,80,80,0.1); border: 1px solid rgba(255,80,80,0.3); color: #ff8080; padding: 5px 12px; border-radius: 8px; cursor: pointer; font-size: 0.8rem; margin-left: 5px; }
        .cancel-btn:hover { background: #ff5050; color: white; }

        /* Modal Styles */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); backdrop-filter: blur(10px); display: none; align-items: center; justify-content: center; z-index: 1000; }
        .modal-overlay.active { display: flex; }
        .modal-content { background: #1a1a1a; padding: 40px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.1); width: 100%; max-width: 450px; }
        .modal-content h2 { margin-bottom: 25px; color: white; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; color: rgba(255,255,255,0.6); font-size: 0.9rem; }
        .form-group input, .form-group textarea { width: 100%; padding: 12px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; color: white; font-family: inherit; }
    </style>
</head>
<body>
<!-- Navbar -->
<header class="glass-nav">
    <a href="/index.html" style="text-decoration:none;"><div class="logo">Crave<span>Bites</span></div></a>
    <div class="nav-actions">
        <div id="user-display" class="user-info">
            <a href="/index.html" class="login-link">Menu</a>
            <button onclick="logoutCustomer()" class="secondary-btn" style="padding:5px 15px; font-size:0.8rem; margin-left:10px;">Logout</button>
        </div>
    </div>
</header>

<div class="profile-container">
    <h1 style="color:white; margin-bottom:40px; font-weight:800;">My <span style="color:var(--primary-color)">Activity</span></h1>

    <div class="profile-grid">
        <aside class="glass-card profile-sidebar">
            <div class="avatar" id="profile-initials">?</div>
            <h2 id="profile-username">Username</h2>
            <p id="profile-email" style="color:rgba(255,255,255,0.6); margin-top:-10px; margin-bottom:30px;"></p>

            <button class="primary-btn" style="width:100%; margin-bottom:20px;" onclick="openEditProfileModal()">Edit Profile</button>

            <div class="stat-item">
                <span>Items Purchased</span>
                <strong id="stat-purchases">0</strong>
            </div>
            <div class="stat-item">
                <span>Last Login</span>
                <span id="stat-last-login" style="font-size:0.8rem; text-align:right;">-</span>
            </div>
        </aside>

        <main>
            <div class="glass-card">
                <h3 style="margin-bottom:25px;">Order History</h3>
                <div id="order-list">
                    <!-- Orders injected here -->
                </div>

                <h3 style="margin-bottom:25px; margin-top:50px;">Your Ratings</h3>
                <div id="rating-list">
                    <!-- Ratings injected here -->
                </div>
            </div>
        </main>
    </div>
</div>

<!-- Edit Profile Modal -->
<div id="edit-profile-modal" class="modal-overlay">
    <div class="modal-content">
        <h2>Edit Profile</h2>
        <div class="form-group">
            <label>Username</label>
            <input type="text" id="edit-username">
        </div>
        <div class="form-group">
            <label>Email</label>
            <input type="email" id="edit-email">
        </div>
        <div class="form-group">
            <label>New Password (leave blank to keep current)</label>
            <input type="password" id="edit-password" placeholder="••••••••">
        </div>
        <div style="display:flex; gap:10px; margin-top:30px;">
            <button class="primary-btn" style="flex:1" onclick="updateProfile()">Save Changes</button>
            <button class="secondary-btn" style="flex:1" onclick="closeModals()">Cancel</button>
        </div>
    </div>
</div>

<!-- Edit Order Modal -->
<div id="edit-order-modal" class="modal-overlay">
    <div class="modal-content">
        <h2>Update Delivery Address</h2>
        <input type="hidden" id="edit-order-id">
        <div class="form-group">
            <label>New Delivery Address</label>
            <textarea id="edit-order-address" rows="3"></textarea>
        </div>
        <div style="display:flex; gap:10px; margin-top:30px;">
            <button class="primary-btn" style="flex:1" onclick="updateOrder()">Update Order</button>
            <button class="secondary-btn" style="flex:1" onclick="closeModals()">Cancel</button>
        </div>
    </div>
</div>

<script>
    let currentUserData = null;

    async function loadProfile() {
        const user = JSON.parse(localStorage.getItem('customer_user'));
        if (!user) {
            window.location.href = '/login.html';
            return;
        }

        try {
            const response = await fetch(`/api/users/profile/${user.id}`);
            const data = await response.json();
            currentUserData = data.user;

            // Sidebar
            document.getElementById('profile-username').innerText = data.user.username;
            document.getElementById('profile-email').innerText = data.user.email || 'No email provided';
            document.getElementById('profile-initials').innerText = data.user.username.charAt(0).toUpperCase();
            document.getElementById('stat-purchases').innerText = data.totalItemsPurchased;
            document.getElementById('stat-last-login').innerText = data.user.lastLogin ? new Date(data.user.lastLogin).toLocaleString() : 'Just now';

            // Orders
            const orderList = document.getElementById('order-list');
            if (data.orders.length === 0) {
                orderList.innerHTML = '<p style="opacity:0.5;">No orders yet. Time to eat!</p>';
            } else {
                orderList.innerHTML = data.orders.reverse().map(order => {
                    const isPending = order.status === 'Pending';
                    return `
                            <div class="activity-item">
                                <div style="display:flex; justify-content:space-between; align-items:start;">
                                    <div>
                                        <div style="font-weight:600; font-size:1.1rem;">Order #${order.orderNumber}</div>
                                        <div style="font-size:0.9rem; margin-top:5px;">Total: Rs ${order.totalAmount.toFixed(2)}</div>
                                        <div style="font-size:0.8rem; color:rgba(255,255,255,0.5); margin-top:3px;">📍 ${order.deliveryAddress || 'No address'}</div>
                                    </div>
                                    ${isPending ? `
                                        <div>
                                            <button class="edit-btn" onclick="openEditOrderModal(${order.id}, '${order.deliveryAddress}')">Edit</button>
                                            <button class="cancel-btn" onclick="cancelOrder(${order.id})">Cancel</button>
                                        </div>
                                    ` : ''}
                                </div>
                                <div class="order-meta">
                                    <span>${new Date(order.orderTime).toLocaleDateString()}</span>
                                    <span style="color:${order.status === 'Delivered' ? '#4caf50' : '#fbc02d'};">${order.status}</span>
                                </div>
                            </div>
                        `;
                }).join('');
            }

            // Ratings
            const ratingList = document.getElementById('rating-list');
            if (data.feedbacks.length === 0) {
                ratingList.innerHTML = '<p style="opacity:0.5;">You haven\'t rated any items yet.</p>';
            } else {
                ratingList.innerHTML = data.feedbacks.map(f => `
                        <div class="activity-item" style="border-left-color: #fbc02d;">
                            <div class="rating-stars">${'★'.repeat(f.rating)}${'☆'.repeat(5-f.rating)}</div>
                            <p style="margin:10px 0;">"${f.comment}"</p>
                            <div class="order-meta">
                                <span>Menu Item ID: ${f.menuItemId}</span>
                            </div>
                        </div>
                    `).join('');
            }

        } catch (err) {
            console.error(err);
        }
    }

    function openEditProfileModal() {
        document.getElementById('edit-username').value = currentUserData.username;
        document.getElementById('edit-email').value = currentUserData.email || '';
        document.getElementById('edit-password').value = '';
        document.getElementById('edit-profile-modal').classList.add('active');
    }

    async function updateProfile() {
        const username = document.getElementById('edit-username').value.trim();
        const email = document.getElementById('edit-email').value.trim();
        const password = document.getElementById('edit-password').value.trim();

        if (!username || !email) {
            alert("Username and Email are required.");
            return;
        }

        const updateData = {
            username,
            email,
            role: currentUserData.role
        };
        if (password) {
            if (password.length < 6) {
                alert("Password must be at least 6 characters.");
                return;
            }
            updateData.password = password;
        }

        try {
            const res = await fetch(`/api/users/${currentUserData.id}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(updateData)
            });
            if (res.ok) {
                const updatedUser = await res.json();
                localStorage.setItem('customer_user', JSON.stringify(updatedUser));
                alert("Profile updated successfully!");
                closeModals();
                loadProfile();
            } else {
                alert("Failed to update profile. Username or Email might be taken.");
            }
        } catch (err) {
            console.error(err);
        }
    }

    function openEditOrderModal(id, address) {
        document.getElementById('edit-order-id').value = id;
        document.getElementById('edit-order-address').value = address || '';
        document.getElementById('edit-order-modal').classList.add('active');
    }

    async function updateOrder() {
        const id = document.getElementById('edit-order-id').value;
        const address = document.getElementById('edit-order-address').value.trim();

        if (!address) {
            alert("Address cannot be empty.");
            return;
        }

        try {
            // First get order to preserve other fields
            const ordRes = await fetch(`/api/orders/${id}`);
            const order = await ordRes.json();
            order.deliveryAddress = address;

            const res = await fetch(`/api/orders/${id}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(order)
            });
            if (res.ok) {
                alert("Order updated successfully!");
                closeModals();
                loadProfile();
            }
        } catch (err) {
            console.error(err);
        }
    }

    async function cancelOrder(id) {
        if (!confirm("Are you sure you want to cancel this order?")) return;
        try {
            const res = await fetch(`/api/orders/${id}`, { method: 'DELETE' });
            if (res.ok) {
                alert("Order cancelled successfully.");
                loadProfile();
            }
        } catch (err) {
            console.error(err);
        }
    }

    function closeModals() {
        document.querySelectorAll('.modal-overlay').forEach(m => m.classList.remove('active'));
    }

    function logoutCustomer() {
        localStorage.removeItem('customer_user');
        window.location.href = '/login.html';
    }

    document.addEventListener('DOMContentLoaded', loadProfile);
</script>
</body>
</html>
