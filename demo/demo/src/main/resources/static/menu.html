<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Menu | Menu Management</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/admin.css">
    <style>
        .nav-links a {
            text-decoration: none;
            color: inherit;
            display: flex;
            align-items: center;
            gap: 15px;
            width: 100%;
            height: 100%;
        }
    </style>
    <script src="/js/auth.js"></script>
</head>

<body>
    <div class="admin-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="logo">Crave<span>Admin</span></div>
            <ul class="nav-links">
                <li><a href="/dashboard.html"><span class="icon">📊</span> Overview & Users</a></li>
                <li class="active"><a href="/menu.html"><span class="icon">🍔</span> Menu</a></li>
                <li><a href="/order.html"><span class="icon">📦</span> Orders</a></li>
                <li><a href="/inventory.html"><span class="icon">🛒</span> Inventory</a></li>
                <li><a href="/promotion.html"><span class="icon">🎟️</span> Promos</a></li>
                <li><a href="/feedback.html"><span class="icon">⭐</span> Feedback</a></li>
            </ul>
            <div class="bottom-actions"><a href="/" class="btn-logout">Back to Store</a></div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="topbar">
                <div class="date-time" id="datetime-display"></div>
                <div class="admin-profile"><span>Admin User</span>
                    <div class="avatar">A</div>
                </div>
            </header>

            <div class="views">
                <section class="view active">
                    <div class="view-header">
                        <h2>Menu Management</h2>
                        <button class="primary-btn" id="add-menu-btn">+ Add Item</button>
                    </div>
                    <div class="table-container">
                        <table>
                            <thead>
                                <tr>
                                    <th>Image</th>
                                    <th>Name</th>
                                    <th>Category</th>
                                    <th>Price</th>
                                    <th>Stock</th>
                                    <th>Availability (Auto-hide)</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="menu-table-body"></tbody>
                        </table>
                    </div>
                </section>
            </div>
        </main>
    </div>

    <!-- Menu Modal -->
    <div class="modal" id="menu-modal">
        <div class="modal-content">
            <h3>Menu Item Details</h3>
            <form id="menu-form">
                <input type="hidden" id="menu-id">
                <div class="form-group"><label>Name</label><input type="text" id="menu-name" required></div>
                <div class="form-group row-group">
                    <div><label>Price (Rs)</label><input type="number" id="menu-price" step="0.01" min="0" required></div>
                    <div>
                        <label>Category</label>
                        <select id="menu-category" required>
                            <option value="burgers">Burgers</option>
                            <option value="pizza">Pizza</option>
                            <option value="beverages">Beverages</option>
                        </select>
                    </div>
                    <div><label>Stock</label><input type="number" id="menu-stock" min="0" value="10" required></div>
                </div>
                <div class="form-group row-group" style="align-items: center;">
                    <div>
                        <label>Upload Image</label>
                        <input type="file" id="menu-image-file" accept="image/*" style="padding: 6px;">
                    </div>
                    <div>
                        <label>OR Image URL</label>
                        <input type="text" id="menu-image-url" placeholder="https://...">
                    </div>
                </div>
                <div class="form-group" style="text-align: center;">
                    <img id="image-preview" src=""
                        style="max-height: 120px; display: none; border-radius: 8px; margin: 10px auto;">
                </div>
                <div class="form-group"><label>Description</label><textarea id="menu-desc" required rows="3"></textarea>
                </div>
                <div class="form-group"><label style="display:flex; align-items:center; gap:10px;"><input
                            type="checkbox" id="menu-available" checked> Available for ordering</label></div>
                <div class="form-actions">
                    <button type="button" class="btn-cancel" onclick="closeModal('menu-modal')">Cancel</button>
                    <button type="submit" class="primary-btn">Save Item</button>
                </div>
            </form>
        </div>
    </div>
    <script src="/js/menu.js"></script>
</body>

</html>
